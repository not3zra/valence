[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valence-order-agent"
version = "0.1.0"
description = "Order Intake & Fulfillment agent — one ADK agent over WhatsApp text, voice and photo, with a graduated human-approval loop."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "asyncpg>=0.29,<1",
    "google-adk==2.6.3",
    "google-genai>=2.12.1,<3",
    "mcp>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
valence = "src.cli:main"

[project.optional-dependencies]
gcp = [
    "google-cloud-firestore>=2.11,<3",
    "google-cloud-storage>=2.18,<4",
]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=0.25",
    "httpx>=0.27,<1",
    "ruff>=0.15,<1",
    "mypy>=1.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "postgres: exercises the Postgres SQL backend (needs TEST_POSTGRES_URL)",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]
