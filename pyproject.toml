[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valence-order-agent"
version = "0.1.0"
description = "Order Intake & Fulfillment agent — one ADK agent over WhatsApp text, voice and photo, with a graduated human-approval loop."
requires-python = ">=3.10"
dependencies = [
    "google-adk==2.6.3",
    "google-cloud-firestore>=2.11,<3",
    "google-cloud-storage>=2.18,<4",
    "google-genai>=2.12.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-asyncio>=0.25",
    "httpx>=0.27,<1",
    "ruff>=0.15,<1",
    "mypy>=1.15",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["tests/"]
