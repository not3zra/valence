# Build + deploy the service to Cloud Run. Wired as a build trigger on `main`
# by infra/provision.sh (auto-deploy on push to main).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valence:${COMMIT_SHA}'
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valence:${COMMIT_SHA}'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valence:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=${_RUN_SA}@$PROJECT_ID.iam.gserviceaccount.com'
      - '--set-secrets=GOOGLE_API_KEY=GEMINI_API_KEY:latest'
      - '--set-secrets=TWILIO_ACCOUNT_SID=TWILIO_ACCOUNT_SID:latest'
      - '--set-secrets=TWILIO_AUTH_TOKEN=TWILIO_AUTH_TOKEN:latest'
      - '--set-secrets=TWILIO_WHATSAPP_FROM=TWILIO_WHATSAPP_FROM:latest'
      - '--set-secrets=TWILIO_WHATSAPP_JOIN_CODE=TWILIO_WHATSAPP_JOIN_CODE:latest'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPO: valence-images
  _SERVICE: valence
  _RUN_SA: valence-cloudrun

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valence:${COMMIT_SHA}'
