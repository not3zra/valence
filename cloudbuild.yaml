# Build + deploy the service to Cloud Run. Wired as a build trigger on `main`
# by infra/provision.sh (auto-deploy on push to main).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - build
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valence:${COMMIT_SHA}'
      - .
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valence:${COMMIT_SHA}'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valence:${COMMIT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--service-account=${_RUN_SA}@$PROJECT_ID.iam.gserviceaccount.com'
      # Gemini is served through Vertex AI (ADC via the runtime SA), not the
      # free-tier API key. asia-southeast1 is the only region serving
      # gemini-3.5-flash on this project (all US/EU regions 404).
      - '--set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=true,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=asia-southeast1,VOUCHER_BUCKET=valence-$PROJECT_ID-vouchers'
      - '--set-secrets=META_APP_SECRET=META_APP_SECRET:latest'
      - '--set-secrets=META_VERIFY_TOKEN=META_VERIFY_TOKEN:latest'
      - '--set-secrets=META_ACCESS_TOKEN=META_ACCESS_TOKEN:latest'
      - '--set-secrets=META_PHONE_NUMBER_ID=META_PHONE_NUMBER_ID:latest'
      - '--set-secrets=ROUNDTRIP_TOKEN=ROUNDTRIP_TOKEN:latest'
      - '--set-secrets=VOICE_INGEST_TOKEN=VOICE_INGEST_TOKEN:latest'
      - '--set-secrets=WEB_PASSCODE=WEB_PASSCODE:latest'
      - '--set-secrets=WEB_PASSCODE_SALT=WEB_PASSCODE_SALT:latest'
      - '--set-env-vars=VOUCHER_BUCKET=valence-$PROJECT_ID-vouchers'

options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _REGION: us-central1
  _REPO: valence-images
  _SERVICE: valence
  _RUN_SA: valence-cloudrun

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/valence:${COMMIT_SHA}'
